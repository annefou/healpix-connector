name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # the two platforms in pixi.toml (linux-64, osx-arm64)
        # climatedt adds healpix-convert, healpix-resample and CPU torch (~1.9 GB): it is
        # what catches a lock update that changes the healpix-convert API we rely on.
        env: [test, climatedt]
    name: ${{ matrix.env }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.68.1
          environments: ${{ matrix.env }}
          locked: true
          cache: true
      # Offline: synthetic fields and recorded fixtures, no account and no download.
      - run: pixi run -e ${{ matrix.env }} test
