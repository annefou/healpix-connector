[workspace]
name = "healpix-connector"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
healpix-geo = ">=0.4.1"
numpy = ">=1.26"

[pypi-dependencies]
healpix-connector = { path = ".", editable = true }

[feature.test.dependencies]
pytest = ">=8"

[feature.test.tasks]
test = "pytest -q"

[feature.convert.dependencies]
rasterio = ">=1.3"
xarray = ">=2024.1"
zarr = ">=3"

[feature.biodiversity.dependencies]
requests = ">=2.31"
pandas = ">=2.1"

[environments]
test = ["test", "convert", "biodiversity"]
convert = ["convert"]
