[workspace]
name = "healpix-connector"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.14"
healpix-geo = ">=0.4.1"
numpy = ">=1.26"

[pypi-dependencies]
healpix-connector = { path = ".", editable = true }

[feature.test.dependencies]
pytest = ">=8"

[feature.test.tasks]
test = "pytest -q"

[feature.climatedt.pypi-dependencies]
polytope-client = "*"
# GRID4EARTH's own Climate DT converter: request definition, HEALPix conventions
# and the sphere -> WGS84 correction all come from there, not from us.
healpix-convert = ">=2026.9"
# healpix-convert asks for torch (healpix-resample uses it); the CPU wheel is
# enough here and the CUDA one does not fit on a normal working disk.
torch = { version = ">=2.9.1", index = "https://download.pytorch.org/whl/cpu" }

[feature.climatedt.dependencies]
cfgrib = "*"
eccodes = "*"

[feature.convert.dependencies]
rasterio = ">=1.3"
netcdf4 = ">=1.6"   # only to read/write the test case's predictor files
cdsapi = ">=0.7"    # ERA5 monthly means from the Copernicus climate data store
xarray = ">=2024.1"
zarr = ">=3"

[feature.biodiversity.dependencies]
requests = ">=2.31"
pandas = ">=2.1"

[environments]
test = ["test", "convert", "biodiversity"]
climatedt = ["convert", "climatedt", "test"]
convert = ["convert"]
